; alembic.ini
; Lives at the REPO ROOT (next to docker-compose.yml, backend/, database/).
; This is what tells Alembic where the migration scripts live and how to
; find your database.

[alembic]
# Where the migration environment (env.py) and version files live.
# Matches the README's ownership table: database/migrations/ = Member 1.
script_location = database/migrations

# We set the real DB URL from Python (env.py) using app.core.config,
# so nobody has to hardcode or duplicate the DATABASE_URL here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

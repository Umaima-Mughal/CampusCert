# Runs the whole product together: database + backend + frontend.
# `docker compose up` and you have the integrated app, not just your own piece.
# Rebuild after installing new dependencies: `docker compose up --build`

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuscert
      POSTGRES_PASSWORD: campuscert
      POSTGRES_DB: campuscert
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscert"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://campuscert:campuscert@db:5432/campuscert
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
